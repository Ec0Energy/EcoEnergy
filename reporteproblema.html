<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoEnergy - Reportar un problema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../styles.css">
    <style>
        body { background-color: #1C202B; font-family: 'Montserrat', sans-serif; color: #FFFFFF; }
        .custom-card { background-color: #282E3D; border: none; border-radius: 1rem; }
        .form-control, .form-select { background-color: #282E3D; border: 1px solid #3d465c; color: #fff; border-radius: 0.75rem; }
        .form-control:focus, .form-select:focus { background-color: #282E3D; border-color: #306EEA; color: #fff; box-shadow: none; }
        .upload-box { border: 2px dashed #4b5563; border-radius: 1rem; background-color: #282E3D; transition: border-color 0.2s; }
        .upload-box:hover { border-color: #306EEA; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="../index.html"><i class="bi bi-lightning-charge-fill"></i> EcoEnergy</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center gap-3">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="misDispositivos.html">Dispositivos</a></li>
                    <li class="nav-item"><a class="nav-link" href="tienda.html">Tienda</a></li>
                    <li class="nav-item"><a class="nav-link active" href="ayuda.html">Ayuda</a></li>
                    <li class="nav-item"><a class="nav-link" href="iniciarSesion.html"><i class="bi bi-person-circle fs-5"></i> Perfil</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="d-flex align-items-center mb-4">
                    <a href="ayuda.html" class="text-white fs-4 me-3 text-decoration-none"><i class="bi bi-arrow-left"></i></a>
                    <h2 class="fw-bold mb-0">Reportar un problema</h2>
                </div>
                <p class="text-secondary mb-4">Contanos qué está pasando y te ayudaremos a solucionarlo lo antes posible.</p>

                <form>
                    <div class="mb-4">
                        <label class="form-label fw-semibold small text-secondary">Tipo de problema</label>
                        <select class="form-select py-3">
                            <option selected disabled>Seleccioná una opción</option>
                            <option value="1">Falla en dispositivo</option>
                            <option value="2">Problema con la cuenta</option>
                            <option value="3">Error de lectura de consumo</option>
                            <option value="4">Otro</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold small text-secondary">Descripción</label>
                        <textarea class="form-control p-3" rows="4" placeholder="Escribí lo que sucede..."></textarea>
                        <div class="text-end text-secondary small mt-1">0/500</div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold small text-secondary">Fotos (opcional)</label>
                        <div class="upload-box p-4 text-center">
                            <i class="bi bi-camera fs-2 text-secondary mb-2 d-block"></i>
                            <span class="fw-semibold d-block text-white">Agregar imágenes</span>
                            <span class="text-secondary small">(máx. 3)</span>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-pill shadow">Enviar reporte</button>
                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
